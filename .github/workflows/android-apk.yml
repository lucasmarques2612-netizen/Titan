name: Build TITAN-SURVIVE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TITAN_SURVIVE_Java_LibGDX_project.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -q TITAN_SURVIVE_Java_LibGDX_project.zip -d unpacked
          test -f unpacked/TitanSurviveJava/settings.gradle

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile Android APK
        run: gradle -p unpacked/TitanSurviveJava :android:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: titan-survive-debug-apk
          path: unpacked/TitanSurviveJava/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
